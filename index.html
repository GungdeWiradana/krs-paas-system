<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRS Cloud Admin Fix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen p-4">
    <div class="max-w-5xl mx-auto space-y-6">
        <div class="bg-white p-6 rounded-2xl shadow-sm flex justify-between items-center">
            <h1 class="text-xl font-bold text-slate-800"><i class="fas fa-university text-blue-600 mr-2"></i>Sistem KRS PaaS</h1>
            <div id="cache-info"></div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm space-y-4 border-t-4 border-blue-500">
                <h2 class="font-bold text-slate-600 uppercase text-xs tracking-widest">Registrasi Baru</h2>
                <div class="space-y-3">
                    <p class="text-xs font-semibold text-slate-400 italic">Input Dosen:</p>
                    <div class="flex gap-2">
                        <input id="dNama" placeholder="Nama Dosen" class="border p-2 rounded-lg w-full text-sm outline-none focus:border-blue-400">
                        <input id="dNip" placeholder="NIP" class="border p-2 rounded-lg w-full text-sm outline-none focus:border-blue-400">
                        <button onclick="saveDosen()" class="bg-blue-600 text-white px-4 rounded-lg hover:bg-blue-700"><i class="fas fa-plus"></i></button>
                    </div>
                </div>
                <hr>
                <div class="space-y-3">
                    <p class="text-xs font-semibold text-slate-400 italic">Input Mahasiswa:</p>
                    <input id="mNama" placeholder="Nama Mahasiswa" class="border p-2 rounded-lg w-full text-sm outline-none focus:border-emerald-400">
                    <input id="mNim" placeholder="NIM" class="border p-2 rounded-lg w-full text-sm outline-none focus:border-emerald-400">
                    <select id="mDosen" class="border p-2 rounded-lg w-full text-sm outline-none bg-white shadow-sm"></select>
                    <button onclick="saveMhs()" class="w-full bg-emerald-600 text-white py-2 rounded-lg font-bold hover:bg-emerald-700">Simpan Mahasiswa</button>
                </div>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm border-t-4 border-orange-400 overflow-hidden">
                <h2 class="font-bold text-slate-600 uppercase text-xs tracking-widest mb-4">Daftar Dosen</h2>
                <div class="max-h-64 overflow-y-auto divide-y" id="dList"></div>
            </div>
        </div>

        <div class="bg-white p-6 rounded-2xl shadow-sm border-t-4 border-indigo-500 overflow-hidden">
            <h2 class="font-bold text-slate-600 uppercase text-xs tracking-widest mb-4 text-center">Data Mahasiswa Bimbingan</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left">
                    <thead class="bg-slate-50 text-slate-500">
                        <tr><th class="p-3">Nama Mahasiswa</th><th class="p-3">NIM</th><th class="p-3">Dosen PA</th><th class="p-3 text-center">Aksi</th></tr>
                    </thead>
                    <tbody id="mTable" class="divide-y"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function fetchAPI(url, method = 'GET', body = null) {
            const options = { method, headers: { 'Content-Type': 'application/json' } };
            if (body) options.body = JSON.stringify(body);
            const res = await fetch('/api' + url, options);
            return res.json();
        }

        async function load() {
            // Load Dosen
            const dosens = await fetchAPI('/dosen');
            document.getElementById('mDosen').innerHTML = dosens.map(d => `<option value="${d.id}">${d.nama}</option>`).join('');
            document.getElementById('dList').innerHTML = dosens.map(d => `
                <div class="py-3 flex justify-between items-center group">
                    <div><p class="font-bold text-slate-700 text-sm">${d.nama}</p><p class="text-[10px] text-slate-400 font-mono italic">${d.nip}</p></div>
                    <div class="opacity-0 group-hover:opacity-100 transition-opacity">
                        <button onclick="editDosen(${d.id}, '${d.nama}', '${d.nip}')" class="text-blue-500 hover:text-blue-700 mr-3"><i class="fas fa-edit"></i></button>
                        <button onclick="delDosen(${d.id})" class="text-red-400 hover:text-red-600"><i class="fas fa-trash-alt"></i></button>
                    </div>
                </div>
            `).join('') || '<p class="text-center text-slate-300 py-4 text-xs italic">Belum ada data dosen</p>';

            // Load Mahasiswa
            const resMhs = await fetchAPI('/mahasiswa');
            document.getElementById('cache-info').innerHTML = `<span class="text-[9px] font-black px-2 py-1 rounded bg-slate-800 text-white uppercase tracking-widest">🚀 SRC: ${resMhs.source}</span>`;
            document.getElementById('mTable').innerHTML = resMhs.data.map(m => `
                <tr class="hover:bg-slate-50 transition-colors">
                    <td class="p-3 font-semibold text-slate-700">${m.nama}</td>
                    <td class="p-3 text-slate-500 font-mono">${m.nim}</td>
                    <td class="p-3"><span class="bg-blue-50 text-blue-600 px-2 py-1 rounded text-[10px] font-bold uppercase">${m.nama_dosen || 'N/A'}</span></td>
                    <td class="p-3 text-center">
                        <button onclick="editMhs(${m.id}, '${m.nama}', '${m.nim}', ${m.id_dosen_pa})" class="bg-blue-100 text-blue-600 p-2 rounded-lg hover:bg-blue-200 mr-1"><i class="fas fa-pen text-xs"></i></button>
                        <button onclick="delMhs(${m.id})" class="bg-red-100 text-red-600 p-2 rounded-lg hover:bg-red-200"><i class="fas fa-trash text-xs"></i></button>
                    </td>
                </tr>
            `).join('') || '<tr><td colspan="4" class="text-center py-10 text-slate-300 italic">Belum ada data mahasiswa</td></tr>';
        }

        async function saveDosen() { 
            const n = document.getElementById('dNama').value; const p = document.getElementById('dNip').value;
            if(n && p) { await fetchAPI('/dosen', 'POST', { nama: n, nip: p }); document.getElementById('dNama').value=''; document.getElementById('dNip').value=''; load(); } 
        }

        async function editDosen(id, n, p) {
            const nama = prompt("Edit Nama Dosen:", n); const nip = prompt("Edit NIP:", p);
            if(nama && nip) { await fetchAPI('/dosen/'+id, 'PUT', { nama, nip }); load(); }
        }

        async function delDosen(id) {
            if(confirm("Yakin hapus dosen?")) {
                const res = await fetch('/api/dosen/'+id, { method: 'DELETE' });
                if(!res.ok) alert("Gagal! Dosen ini masih punya mahasiswa bimbingan.");
                load();
            }
        }

        async function saveMhs() {
            const n = document.getElementById('mNama').value; const ni = document.getElementById('mNim').value; const d = document.getElementById('mDosen').value;
            if(n && ni && d) { await fetchAPI('/mahasiswa', 'POST', { nama: n, nim: ni, id_dosen_pa: d }); document.getElementById('mNama').value=''; document.getElementById('mNim').value=''; load(); }
        }

        async function editMhs(id, n, ni, d) {
            const nama = prompt("Edit Nama Mahasiswa:", n); const nim = prompt("Edit NIM:", ni);
            if(nama && nim) { await fetchAPI('/mahasiswa/'+id, 'PUT', { nama, nim, id_dosen_pa: d }); load(); }
        }

        async function delMhs(id) { if(confirm("Hapus mahasiswa ini?")) { await fetchAPI('/mahasiswa/'+id, 'DELETE'); load(); } }

        load();
    </script>
</body>
</html>
