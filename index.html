<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRS Cloud Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-100 to-blue-100 min-h-screen">

    <nav class="bg-white/80 sticky top-0 z-50 border-b border-slate-200 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-2">
                    <div class="bg-blue-600 p-2 rounded-lg text-white">
                        <i class="fas fa-graduation-cap"></i>
                    </div>
                    <span class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-indigo-600">
                        Sistem KRS Cloud
                    </span>
                </div>
                <div id="connection-status" class="flex items-center gap-2 text-xs font-semibold text-green-600 bg-green-50 px-3 py-1 rounded-full border border-green-200">
                    <span class="relative flex h-2 w-2">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
                    </span>
                    Connected to Aiven
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <div class="lg:col-span-1 space-y-6">
                <div class="glass p-6 rounded-2xl shadow-sm border border-white hover:shadow-md transition-all">
                    <h2 class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-4 flex items-center gap-2">
                        <i class="fas fa-user-tie text-blue-500"></i> Registrasi Dosen
                    </h2>
                    <div class="space-y-3">
                        <input id="dNama" placeholder="Nama Lengkap Dosen" class="w-full px-4 py-2 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all">
                        <input id="dNip" placeholder="Nomor Induk Pegawai" class="w-full px-4 py-2 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                        <button onclick="addDosen()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-xl transition-all shadow-lg shadow-blue-200 active:scale-95">
                            Simpan Data Dosen
                        </button>
                    </div>
                </div>

                <div class="glass p-6 rounded-2xl shadow-sm border border-white hover:shadow-md transition-all">
                    <h2 class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-4 flex items-center gap-2">
                        <i class="fas fa-user-graduate text-emerald-500"></i> Registrasi Mahasiswa
                    </h2>
                    <div class="space-y-3">
                        <input id="mNama" placeholder="Nama Mahasiswa" class="w-full px-4 py-2 rounded-xl border border-slate-200 focus:ring-2 focus:ring-emerald-500 outline-none transition-all">
                        <input id="mNim" placeholder="NIM Mahasiswa" class="w-full px-4 py-2 rounded-xl border border-slate-200 focus:ring-2 focus:ring-emerald-500 outline-none transition-all">
                        <select id="mDosen" class="w-full px-4 py-2 rounded-xl border border-slate-200 focus:ring-2 focus:ring-emerald-500 outline-none bg-white"></select>
                        <button onclick="addMahasiswa()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 rounded-xl transition-all shadow-lg shadow-emerald-200 active:scale-95">
                            Daftarkan Mahasiswa
                        </button>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-2">
                <div class="glass rounded-2xl shadow-sm border border-white overflow-hidden">
                    <div class="p-6 border-b border-slate-100 flex justify-between items-center">
                        <div>
                            <h2 class="text-xl font-bold text-slate-800 text-lg">Daftar Mahasiswa Terdaftar</h2>
                            <p class="text-xs text-slate-500 mt-1">Data dikelola secara real-time dengan Redis Caching</p>
                        </div>
                        <div id="cache-indicator"></div>
                    </div>
                    
                    <div class="overflow-x-auto">
                        <table class="w-full">
                            <thead>
                                <tr class="bg-slate-50/50 text-left">
                                    <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider">Mahasiswa</th>
                                    <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider">NIM</th>
                                    <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider">Pembimbing (PA)</th>
                                </tr>
                            </thead>
                            <tbody id="mTable" class="divide-y divide-slate-100 bg-white">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script>
        const API = ""; 

        async function loadData() {
            const resDosen = await fetch(API + '/dosen');
            const dosens = await resDosen.json();
            document.getElementById('mDosen').innerHTML = dosens.map(d => `<option value="${d.id}">${d.nama}</option>`).join('');

            const resMhs = await fetch(API + '/mahasiswa');
            const dataMhs = await resMhs.json();
            
            // Indicator Caching
            const isCached = dataMhs.source === 'cache';
            document.getElementById('cache-indicator').innerHTML = `
                <span class="px-3 py-1 rounded-full text-[10px] font-bold tracking-tighter uppercase ${isCached ? 'bg-orange-100 text-orange-600 animate-pulse' : 'bg-blue-100 text-blue-600'}">
                    <i class="fas fa-bolt mr-1"></i> Source: ${dataMhs.source}
                </span>
            `;

            document.getElementById('mTable').innerHTML = dataMhs.data.map(m => `
                <tr class="hover:bg-slate-50/80 transition-colors">
                    <td class="px-6 py-4 font-semibold text-slate-700">${m.nama}</td>
                    <td class="px-6 py-4 text-slate-500 text-sm font-mono">${m.nim}</td>
                    <td class="px-6 py-4">
                        <span class="inline-flex items-center gap-1.5 py-1 px-2.5 rounded-md text-xs font-medium bg-indigo-50 text-indigo-700 border border-indigo-100">
                            ${m.nama_dosen || 'Belum Ditentukan'}
                        </span>
                    </td>
                </tr>
            `).join('');
        }

        async function addDosen() {
            const nama = document.getElementById('dNama').value;
            const nip = document.getElementById('dNip').value;
            if(!nama || !nip) return alert('Isi semua data dosen!');
            
            await fetch(API + '/dosen', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ nama, nip })
            });
            document.getElementById('dNama').value = '';
            document.getElementById('dNip').value = '';
            loadData();
        }

        async function addMahasiswa() {
            const nama = document.getElementById('mNama').value;
            const nim = document.getElementById('mNim').value;
            const id_dosen_pa = document.getElementById('mDosen').value;
            if(!nama || !nim) return alert('Isi semua data mahasiswa!');

            await fetch(API + '/mahasiswa', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ nama, nim, id_dosen_pa })
            });
            document.getElementById('mNama').value = '';
            document.getElementById('mNim').value = '';
            loadData();
        }

        loadData();
    </script>
</body>
</html>
