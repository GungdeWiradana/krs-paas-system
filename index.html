<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRS Cloud Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8">
    <div class="max-w-6xl mx-auto space-y-8">
        <header class="flex justify-between items-center bg-white p-6 rounded-2xl shadow-sm">
            <h1 class="text-2xl font-bold text-slate-800"><i class="fas fa-database text-blue-600 mr-2"></i>KRS Management System</h1>
            <div id="cache-status"></div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="bg-white p-6 rounded-2xl shadow-sm space-y-6">
                <h2 class="font-bold border-b pb-2">Input Data</h2>
                <div class="space-y-4">
                    <p class="text-xs font-bold text-slate-400 uppercase">Dosen</p>
                    <div class="flex gap-2">
                        <input id="dNama" placeholder="Nama" class="border p-2 rounded-lg w-full text-sm">
                        <input id="dNip" placeholder="NIP" class="border p-2 rounded-lg w-full text-sm">
                        <button onclick="saveDosen()" class="bg-blue-600 text-white px-4 rounded-lg"><i class="fas fa-plus"></i></button>
                    </div>
                </div>
                <div class="space-y-4 pt-4 border-t">
                    <p class="text-xs font-bold text-slate-400 uppercase">Mahasiswa</p>
                    <input id="mNama" placeholder="Nama Mahasiswa" class="border p-2 rounded-lg w-full text-sm">
                    <input id="mNim" placeholder="NIM" class="border p-2 rounded-lg w-full text-sm">
                    <select id="mDosen" class="border p-2 rounded-lg w-full text-sm"></select>
                    <button onclick="saveMhs()" class="w-full bg-emerald-600 text-white py-2 rounded-lg font-bold">Daftarkan Mahasiswa</button>
                </div>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm overflow-hidden">
                <h2 class="font-bold mb-4">Daftar Dosen (Read/Update/Delete)</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                        <tbody id="dTable" class="divide-y"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="bg-white p-6 rounded-2xl shadow-sm overflow-hidden">
            <h2 class="font-bold mb-4">Data Mahasiswa (Read/Update/Delete)</h2>
            <table class="w-full text-sm text-left">
                <thead class="bg-slate-50">
                    <tr><th class="p-3">Nama</th><th class="p-3">NIM</th><th class="p-3">Dosen PA</th><th class="p-3">Aksi</th></tr>
                </thead>
                <tbody id="mTable" class="divide-y"></tbody>
            </table>
        </div>
    </div>

    <script>
        async function load() {
            const resDosen = await fetch('/dosen');
            const dosens = await resDosen.json();
            document.getElementById('mDosen').innerHTML = dosens.map(d => `<option value="${d.id}">${d.nama}</option>`).join('');
            document.getElementById('dTable').innerHTML = dosens.map(d => `
                <tr class="py-2">
                    <td class="p-2 font-medium">${d.nama} <br><span class="text-xs text-slate-400">${d.nip}</span></td>
                    <td class="p-2 text-right">
                        <button onclick="editDosen(${d.id}, '${d.nama}', '${d.nip}')" class="text-blue-500 mr-2"><i class="fas fa-edit"></i></button>
                        <button onclick="delDosen(${d.id})" class="text-red-400"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');

            const resMhs = await fetch('/mahasiswa');
            const mhs = await resMhs.json();
            document.getElementById('cache-status').innerHTML = `<span class="text-[10px] px-2 py-1 rounded-full bg-slate-100 font-bold tracking-widest text-slate-500 uppercase">⚡ ${mhs.source}</span>`;
            document.getElementById('mTable').innerHTML = mhs.data.map(m => `
                <tr>
                    <td class="p-3 font-semibold text-slate-700">${m.nama}</td>
                    <td class="p-3 text-slate-500 font-mono">${m.nim}</td>
                    <td class="p-3"><span class="bg-indigo-50 text-indigo-600 px-2 py-1 rounded text-xs font-bold">${m.nama_dosen || '-'}</span></td>
                    <td class="p-3">
                        <button onclick="editMhs(${m.id}, '${m.nama}', '${m.nim}', ${m.id_dosen_pa})" class="text-blue-500 mr-2"><i class="fas fa-edit"></i></button>
                        <button onclick="delMhs(${m.id})" class="text-red-400"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        async function saveDosen() {
            await fetch('/dosen', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ nama: document.getElementById('dNama').value, nip: document.getElementById('dNip').value })});
            load();
        }

        async function editDosen(id, n, p) {
            const nama = prompt("Nama Baru:", n); const nip = prompt("NIP Baru:", p);
            if(nama && nip) await fetch('/dosen/'+id, { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ nama, nip })});
            load();
        }

        async function delDosen(id) { if(confirm("Hapus dosen?")) { const r = await fetch('/dosen/'+id, { method: 'DELETE' }); if(!r.ok) alert("Dosen tidak bisa dihapus karena masih membimbing mahasiswa!"); load(); } }

        async function saveMhs() {
            await fetch('/mahasiswa', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ nama: document.getElementById('mNama').value, nim: document.getElementById('mNim').value, id_dosen_pa: document.getElementById('mDosen').value })});
            load();
        }

        async function editMhs(id, n, ni, d) {
            const nama = prompt("Nama Baru:", n); const nim = prompt("NIM Baru:", ni);
            if(nama && nim) await fetch('/mahasiswa/'+id, { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ nama, nim, id_dosen_pa: d })});
            load();
        }

        async function delMhs(id) { if(confirm("Hapus mahasiswa?")) { await fetch('/mahasiswa/'+id, { method: 'DELETE' }); load(); } }

        load();
    </script>
</body>
</html>
